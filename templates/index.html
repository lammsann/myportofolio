<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portofolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_main' %}#skills">Skills</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Ilmu Komputer &middot; Universitas Indonesia</p>
                    <h1>{{name}}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/foto-profil.png" alt="Photo of {{name}}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{bio}}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{npm}}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{study_program}}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/lammsann/" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/ghulam-muhammad-ihsan/" class="social-link">LinkedIn</a>
                        <a href="ghulam.muhammad@ui.ac.id" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
        <!-- bikin section baru khusus skill -->
        <section class="skills-section" id="skills">
            <div class="container">
                <h2>Skills</h2>
                <div class="skills-grid">
                    <div class="skills-card">
                        <h3>Programming</h3> 
                        <p>Python, Java, Networking</p>                       
                    </div>
                </div>
            </div>
        </section>
        <!-- <section class="mahasiswa-section" id="mahasiswa">
            <div class="container">
                <h2>Daftar Mahasiswa (Hands-on)</h2>
                <ul>
                    {% for mhs in mahasiswa_list %}
                        <li>{{ mhs.nama }} - {{ mhs.npm }}</li>
                    {% empty %}
                        <li>Belum ada data mahasiswa.</li>
                    {% endfor %}
                </ul>
            </div>
        </section> -->
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
